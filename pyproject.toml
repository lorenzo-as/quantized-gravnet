[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61.0"]

[project]
authors = [
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]
description = "A quantized QKeras-based implementation of the GravNet architecture."
name = "quantized-gravnet"
readme = "README.md"
requires-python = ">=3.11"
version = "0.1.0"

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
filterwarnings = [
  "ignore::DeprecationWarning:tensorflow_model_optimization"
]

[tool.ruff]

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
quote-style = "double"

[tool.ruff.isort]
combine-as-imports = true
force-sort-within-sections = true
known-first-party = ["qgravnet"]

[tool.ruff.lint]
fixable = ["ALL"]
ignore = ["E501"]
select = ["E", "F", "I"]

[tool.setuptools.packages.find]
include = ["qgravnet*"]
where = ["."]
