name: Compatibility

on:
  workflow_dispatch:

jobs:
  test:
    name: Test py${{ matrix.python-version }} tf${{ matrix.tensorflow-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            tensorflow-version: "2.14.1"
          - python-version: "3.11"
            tensorflow-version: "2.14.1"
          - python-version: "3.10"
            tensorflow-version: "2.15.1"
          - python-version: "3.11"
            tensorflow-version: "2.15.1"
          - python-version: "3.10"
            tensorflow-version: "2.16.2"
          - python-version: "3.11"
            tensorflow-version: "2.16.2"
          - python-version: "3.12"
            tensorflow-version: "2.16.2"
          - python-version: "3.10"
            tensorflow-version: "2.18.1"
          - python-version: "3.11"
            tensorflow-version: "2.18.1"
          - python-version: "3.12"
            tensorflow-version: "2.18.1"
          - python-version: "3.10"
            tensorflow-version: "2.19.1"
          - python-version: "3.11"
            tensorflow-version: "2.19.1"
          - python-version: "3.12"
            tensorflow-version: "2.19.1"
          - python-version: "3.10"
            tensorflow-version: "2.20.0"
          - python-version: "3.11"
            tensorflow-version: "2.20.0"
          - python-version: "3.12"
            tensorflow-version: "2.20.0"
          - python-version: "3.13"
            tensorflow-version: "2.20.0"
          - python-version: "3.10"
            tensorflow-version: "2.21.0"
          - python-version: "3.11"
            tensorflow-version: "2.21.0"
          - python-version: "3.12"
            tensorflow-version: "2.21.0"
          - python-version: "3.13"
            tensorflow-version: "2.21.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "numpy<2" \
            "tensorflow==${{ matrix.tensorflow-version }}" \
            "qkeras==0.9.0" \
            "pyparsing>=3.0" \
            "pytest==8.4.2"

          pip install -e . --no-deps

      - name: Print environment diagnostics
        run: |
          python --version
          python - <<'PY'
          import tensorflow as tf

          print(f"tensorflow={tf.__version__}")
          keras_version = getattr(tf.keras, "__version__", None)
          if keras_version is not None:
              print(f"tf.keras={keras_version}")
          PY

      - name: Run tests
        run: pytest -q
