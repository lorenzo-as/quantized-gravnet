name: QGravNet Tests

on:
  push:
    branches: [dev, qkeras-classic]
  pull_request:
    branches: [dev, qkeras-classic]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ github.ref }}-${{ hashFiles('**/pyproject.toml') }}

      - name: Install deps (dev branch qkeras-v3 stack)
        if: github.ref == 'refs/heads/dev'
        run: |
          python -m pip install --upgrade pip
          pip install \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple \
            qkeras-v3==1.0.3
          pip install -e ".[dev]"

      - name: Install deps (qkeras-classic branch TF-Keras + QKeras)
        if: github.ref == 'refs/heads/qkeras-classic'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q
