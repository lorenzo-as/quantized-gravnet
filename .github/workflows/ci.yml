name: QGravNet Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ github.ref }}-${{ hashFiles('**/pyproject.toml') }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip

          if [[ "${GITHUB_REF}" == *"qkerasV3"* ]]; then
            pip install \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple \
              qkeras-v3==1.0.3
          fi

          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Run pre-commit checks
        run: |
          pip install pre-commit
          pre-commit run --all-files
